
<script>
"use strict";

/* BatchCheck GPS — screenshot address first,
   nearby alternatives second, automatic TAKE/SKIP. */

(() => {
  const brands = [
    "Publix", "The Fresh Market", "Walgreens",
    "Bravo", "Aldi", "Sprouts", "Costco",
    "Sam's Club", "Target", "H Mart",
    "Walmart", "Winn-Dixie", "Whole Foods"
  ];

  let gps = null;
  let latestOffers = [];
  let generation = 0;
  let activeCards = [];

  const style = document.createElement("style");
  style.textContent = `
    #preview {
      width:auto; max-width:100%; height:115px;
      object-fit:contain; display:block; margin:10px auto;
    }
    #preview[hidden] { display:none; }
    .gps-card {
      background:#0d1a30; border:1px solid #405471;
      border-radius:13px; padding:14px; margin-top:12px;
    }
    .gps-card select,.gps-card button {
      width:100%; min-height:46px; margin:6px 0;
      font-size:16px;
    }
    .gps-card select {
      background:#182842; color:white;
      border:1px solid #60718d;
      border-radius:9px; padding:10px;
    }
    .gps-result {
      font-size:21px; font-weight:800;
      margin:12px 0; line-height:1.5;
    }
    .gps-note {
      color:#ffcc80; font-size:13px;
      line-height:1.5;
    }
    .gps-card [hidden] { display:none!important; }
  `;
  document.head.append(style);

  const gpsStatus = document.createElement("p");
  gpsStatus.className = "muted small";
  gpsStatus.textContent = "📍 Connecting to GPS...";

  const fileInput = document.getElementById("file");
  fileInput.parentElement.insertBefore(gpsStatus, fileInput);

  const oldDrive = document.getElementById("drive");
  if (oldDrive) oldDrive.closest("label").hidden = true;

  function add(parent, tag, value, className) {
    const element = document.createElement(tag);
    if (value !== undefined) element.textContent = value;
    if (className) element.className = className;
    parent.append(element);
    return element;
  }

  function milesBetween(a, b, c, d) {
    const rad = n => n * Math.PI / 180;
    const h =
      Math.sin(rad(c-a)/2)**2 +
      Math.cos(rad(a))*Math.cos(rad(c))*
      Math.sin(rad(d-b)/2)**2;
    return 3958.8 * 2 * Math.asin(
      Math.min(1, Math.sqrt(h))
    );
  }

  function valid(point) {
    return Number.isFinite(point.lat) &&
           Number.isFinite(point.lon);
  }

  function locationUpdate(position) {
    const previous = gps;

    gps = {
      lat: position.coords.latitude,
      lon: position.coords.longitude,
      accuracy: position.coords.accuracy,
      time: position.timestamp
    };

    gpsStatus.textContent =
      "📍 GPS connected · ±" +
      Math.round(gps.accuracy) + " meters";

    if (!previous && latestOffers.length) {
      show(latestOffers);
    } else if (
      previous &&
      milesBetween(
        previous.lat, previous.lon,
        gps.lat, gps.lon
      ) > 0.5
    ) {
      activeCards.forEach(card => card.recalculate());
    }
  }

  if (navigator.geolocation) {
    navigator.geolocation.watchPosition(
      locationUpdate,
      error => {
        gpsStatus.textContent =
          "⚠ GPS unavailable: " + error.message;
      },
      {
        enableHighAccuracy: true,
        maximumAge: 0,
        timeout: 20000
      }
    );
  } else {
    gpsStatus.textContent = "GPS unsupported.";
  }

  async function geocodeAddress(address, loc) {
    if (!address || !/\d+\s+\S+/.test(address)) {
      return null;
    }

    const queries = [
      address,
      address + ", Orlando, Florida",
      address + ", Florida"
    ];

    const streetNumber =
      address.match(/\b\d{2,6}\b/)?.[0];

    for (const query of queries) {
      try {
        const url =
          "https://nominatim.openstreetmap.org/search" +
          "?format=json&limit=5&addressdetails=1&q=" +
          encodeURIComponent(query);

        const response = await fetch(url);
        if (!response.ok) continue;

        const places = await response.json();

        for (const place of places) {
          const point = {
            name: place.display_name,
            address: place.display_name,
            lat: Number(place.lat),
            lon: Number(place.lon),
            source: "screenshot"
          };

          if (!valid(point)) continue;

          const returnedNumber =
            String(place.address?.house_number || "");

          if (
            streetNumber &&
            returnedNumber !== streetNumber
          ) continue;

          if (!returnedNumber) {
            const numbers =
              point.address.match(/\b\d{2,6}\b/g) || [];

            if (!numbers.includes(streetNumber)) continue;
          }

          point.distance = milesBetween(
            loc.lat, loc.lon,
            point.lat, point.lon
          );

          return point;
        }
      } catch (error) {
        console.warn("Address search:", error);
      }
    }

    return null;
  }

  async function findNearby(brand, loc) {
    if (!brand) return [];

    const pattern = brand
      .replace(/[^a-zA-Z0-9 ]/g, ".")
      .replace(/\s+/g, ".?");

    const query =
      '[out:json][timeout:18];' +
      '(nwr["shop"]["name"~"' +
      pattern +
      '",i](around:24000,' +
      loc.lat + ',' + loc.lon +
      '););out center 70;';

    const controller = new AbortController();
    const timer = setTimeout(
      () => controller.abort(), 18000
    );

    let places = [];

    try {
      const response = await fetch(
        "https://overpass.kumi.systems/api/interpreter",
        {
          method: "POST",
          body: new URLSearchParams({data:query}),
          signal: controller.signal
        }
      );

      if (!response.ok) {
        throw new Error("Store lookup unavailable");
      }

      const data = await response.json();

      places = (data.elements || []).map(item => ({
        name: item.tags?.name || brand,
        address: [
          item.tags?.["addr:housenumber"],
          item.tags?.["addr:street"],
          item.tags?.["addr:city"]
        ].filter(Boolean).join(" "),
        lat: Number(item.lat ?? item.center?.lat),
        lon: Number(item.lon ?? item.center?.lon),
        source: "alternative"
      }));

    } catch (error) {
      console.warn("Nearby search:", error);
    } finally {
      clearTimeout(timer);
    }

    const seen = new Set();

    return places
      .filter(valid)
      .map(point => ({
        ...point,
        distance: milesBetween(
          loc.lat, loc.lon,
          point.lat, point.lon
        )
      }))
      .filter(point => point.distance <= 25)
      .sort((a,b) => a.distance-b.distance)
      .filter(point => {
        const key =
          point.lat.toFixed(4) + "," +
          point.lon.toFixed(4);

        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      })
      .slice(0,20);
  }

  async function roadRoute(destination, loc) {
    const url =
      "https://router.project-osrm.org/route/v1/driving/" +
      loc.lon + "," + loc.lat + ";" +
      destination.lon + "," + destination.lat +
      "?overview=false";

    const response = await fetch(url);

    if (!response.ok) {
      throw new Error("Road routing unavailable");
    }

    const data = await response.json();

    if (data.code !== "Ok" || !data.routes?.length) {
      throw new Error("No road route found");
    }

    return {
      minutes: Math.ceil(data.routes[0].duration / 60),
      miles: data.routes[0].distance / 1609.344
    };
  }

  function evaluate(batch, drive, brand) {
    const multiplier = mult(brand);

    const fast =
      drive +
      batch.items * 40 / 60 * multiplier +
      (batch.items ? 10 : 0) +
      batch.shopOnly * 5 +
      batch.miles * 2 +
      batch.deliveries * 5;

    const slow =
      drive +
      batch.items * 55 / 60 * multiplier +
      (batch.items ? 20 : 0) +
      batch.shopOnly * 5 +
      batch.miles * 4 +
      batch.deliveries * 10;

    if (fast <= 0 || slow <= 0) return null;

    const low = batch.pay * 60 / slow;
    const high = batch.pay * 60 / fast;

    return {
      fast, slow, low, high,
      midpoint: (low + high) / 2
    };
  }

  // Replace the old results display, not the OCR scanner.
  show = function(offers) {
    latestOffers = offers;
    const currentRun = ++generation;

    const cards = document.getElementById("cards");
    document.getElementById("results").hidden = false;

    cards.replaceChildren();
    activeCards = [];

    if (!offers.length) {
      add(cards, "p",
        "No batches recognized. Check extracted text.",
        "warn");
      return;
    }

    offers.forEach((batch, index) => {
      const card = add(cards, "div", undefined, "offer");

      add(card, "h3",
        "Batch " + (index+1) + " · " +
        (batch.pay === null
          ? "Payment missing"
          : money(batch.pay)));

      add(card, "p",
        (batch.items ?? "?") + " items · " +
        batch.deliveries + " deliveries · " +
        batch.shopOnly + " Shop Only · " +
        (batch.miles ?? "?") + " miles");

      if (batch.address) {
        add(card, "p",
          "📍 Screenshot store address: " +
          batch.address, "muted small");
      }

      const missing = [];

      if (batch.pay === null) missing.push("payment");
      if (batch.items === null) missing.push("items");
      if (batch.miles === null) missing.push("mileage");

      if (missing.length) {
        add(card, "p",
          "NEEDS DETAILS: " + missing.join(", "),
          "warn");
        return;
      }

      const area = add(card, "div", undefined, "gps-card");

      add(area, "p",
        "Store brand:", "muted small");

      const brandSelect = add(area, "select");
      const placeholder =
        add(brandSelect, "option", "Select store brand");
      placeholder.value = "";

      brands.forEach(name => {
        const option = add(brandSelect, "option", name);
        option.value = name;
      });

      const detected = brands.find(name =>
        name.toLowerCase() ===
        String(batch.store).toLowerCase()
      );

      if (detected) brandSelect.value = detected;

      const branchSelect = add(area, "select");
      branchSelect.hidden = true;

      const output = add(
        area, "p",
        "Waiting for GPS and screenshot address...",
        "gps-note"
      );

      const details = add(area, "p", "", "muted small");
      const note = add(area, "p", "", "gps-note");

      const refresh = add(
        area, "button", "Refresh store locations"
      );
      refresh.type = "button";

      let branches = [];
      let selected = null;
      let sequence = 0;

      async function recalculate() {
        if (!gps || !selected) return;

        const token = ++sequence;
        const loc = {...gps};
        const branch = selected;

        output.className = "gps-note";
        output.textContent =
          "Calculating GPS driving time...";

        try {
          const route = await roadRoute(branch, loc);

          if (
            token !== sequence ||
            currentRun !== generation
          ) return;

          const calculation = evaluate(
            batch,
            route.minutes,
            brandSelect.value || batch.store
          );

          if (!calculation) {
            throw new Error("Invalid batch details");
          }

          const take = calculation.midpoint >= 20;

          output.className =
            "gps-result " + (take ? "take" : "skip");

          output.textContent =
            (take ? "TAKE" : "SKIP") +
            " · " + money(calculation.midpoint) +
            "/hr midpoint";

          details.textContent =
            "GPS drive: " + route.minutes + " min · " +
            route.miles.toFixed(1) + " road miles" +
            "\nHourly range: " +
            money(calculation.low) + "–" +
            money(calculation.high) + "/hr" +
            "\nTotal estimated time: " +
            Math.round(calculation.fast) + "–" +
            Math.round(calculation.slow) + " min";

          note.textContent =
            (branch.source === "screenshot"
              ? "Using the screenshot's store address. "
              : "PROVISIONAL: using an alternative branch. ") +
            "Verify the location and screenshot details. " +
            "Driving estimate excludes live traffic.";

        } catch (error) {
          if (token !== sequence) return;

          output.className = "gps-note";
          output.textContent =
            "Unable to calculate: " + error.message;

          details.textContent = "";
        }
      }

      function populateBranches() {
        branchSelect.replaceChildren();

        branches.forEach((branch, i) => {
          const label =
            (branch.source === "screenshot"
              ? "📍 SCREENSHOT PICKUP · "
              : "Alternative · ") +
            (branch.address || branch.name) +
            " · " + branch.distance.toFixed(1) +
            " mi away";

          const option = add(branchSelect, "option", label);
          option.value = String(i);
        });

        branchSelect.hidden = !branches.length;
        branchSelect.value = "0";
        selected = branches[0] || null;
      }

      async function search() {
        const token = ++sequence;
        selected = null;
        branches = [];
        branchSelect.hidden = true;
        details.textContent = "";

        if (!gps) {
          output.textContent =
            "Waiting for phone GPS permission...";
          return;
        }

        const loc = {...gps};

        output.textContent =
          "Locating screenshot pickup address...";

        let screenshotStore = null;

        if (batch.address) {
          screenshotStore = await geocodeAddress(
            batch.address, loc
          );
        }

        if (
          token !== sequence ||
          currentRun !== generation
        ) return;

        // Calculate from screenshot address immediately,
        // without waiting for alternative store searches.
        if (screenshotStore) {
          branches = [screenshotStore];
          populateBranches();
          await recalculate();
        } else {
          output.textContent =
            "Screenshot address not located. " +
            "Searching nearby store branches...";
        }

        if (!brandSelect.value) {
          if (!screenshotStore) {
            output.textContent =
              "Could not locate screenshot address. " +
              "Select the store brand to find alternatives.";
          }
          return;
        }

        let nearby = [];

        try {
          nearby = await findNearby(
            brandSelect.value, loc
          );
        } catch (error) {
          console.warn("Store search failed:", error);
        }

        if (currentRun !== generation) return;

        const alternatives = nearby.filter(point =>
          !screenshotStore ||
          milesBetween(
            point.lat, point.lon,
            screenshotStore.lat, screenshotStore.lon
          ) > 0.15
        );

        branches = screenshotStore
          ? [screenshotStore, ...alternatives]
          : alternatives;

        if (!branches.length) {
          output.textContent =
            "No verified pickup address or nearby " +
            "store locations found. No TAKE/SKIP.";
          return;
        }

        populateBranches();

        // If the screenshot address was found,
        // preserve it as the selected location.
        // Otherwise estimate using the closest branch.
        if (!screenshotStore) {
          await recalculate();
        }
      }

      branchSelect.addEventListener("change", () => {
        selected =
          branches[Number(branchSelect.value)] || null;
        recalculate();
      });

      brandSelect.addEventListener("change", search);
      refresh.addEventListener("click", search);

      activeCards.push({recalculate});

      if (gps) search();
    });
  };
})();
</script>
